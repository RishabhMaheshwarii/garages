<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garage Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2 2 7v13h6v-6h8v6h6V7L12 2Zm-2 14v4h4v-4h-4Z"/></svg>
      <span>Garage Finder</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="find" role="tab">Find a garage</button>
      <button class="tab" data-view="garages" role="tab">Garages</button>
      <button class="tab" data-view="services" role="tab">Services</button>
    </nav>
  </header>

  <!-- FIND -->
  <main id="view-find" class="view active">
    <section class="search card">
      <div class="field grow">
        <label id="f-services-label">Services</label>
        <div class="multiselect" id="svc-select">
          <button type="button" class="ms-toggle" id="svc-toggle" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="f-services-label svc-summary">
            <span id="svc-summary">All services</span>
            <svg class="ms-caret" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z"/></svg>
          </button>
          <div class="ms-panel" id="svc-panel" role="listbox" aria-multiselectable="true" hidden>
            <label class="ms-opt ms-all"><input type="checkbox" id="f-all" checked /> All services</label>
            <div id="f-services" class="ms-list">
              <div class="ms-loading"><span class="spinner"></span> Loading services…</div>
            </div>
            <div class="ms-foot">
              <span class="muted">Garages must offer all selected</span>
              <button type="button" class="btn small primary" id="svc-done">Done</button>
            </div>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="f-radius">Radius</label>
        <select id="f-radius">
          <option value="3" selected>3 km</option>
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="25">25 km</option>
          <option value="50">50 km</option>
        </select>
      </div>
      <div class="field">
        <label>Location</label>
        <button id="f-locate" class="btn ghost" type="button">📍 Use my location</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="f-search" class="btn primary" type="button">Search</button>
      </div>
      <p class="hint full">Tip: click anywhere on the map to search from that point.</p>
    </section>

    <section class="find-layout">
      <div class="map-wrap">
        <div id="map" class="map card"></div>
        <div id="map-loader" class="map-loader" hidden><span class="spinner"></span> Searching…</div>
      </div>
      <div class="results">
        <div class="results-head">
          <h2 id="results-title">Nearby garages</h2>
          <span id="results-count" class="muted"></span>
        </div>
        <ul id="results" class="result-list"></ul>
      </div>
    </section>
  </main>

  <!-- GARAGES -->
  <main id="view-garages" class="view">
    <div class="view-head">
      <h1>Garages</h1>
    </div>
    <div id="garage-list" class="grid"></div>
  </main>

  <!-- SERVICES -->
  <main id="view-services" class="view">
    <div class="view-head">
      <h1>Services</h1>
    </div>
    <div class="card table-wrap">
      <table class="table">
        <thead><tr><th>Name</th><th>Description</th><th>Garages</th></tr></thead>
        <tbody id="service-rows"></tbody>
      </table>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
